<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>いまやることタイマー</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f242e;
    --line: #2a303c;
    --text: #e7eaf0;
    --muted: #8b93a3;
    --accent: #4f9dff;
    --accent-soft: rgba(79, 157, 255, 0.15);
    --done: #4caf7d;
    --warn: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 92px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 14px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .now-clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

  .summary { display: flex; gap: 10px; margin-bottom: 12px; }
  .summary .card {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 9px 12px;
  }
  .summary .label { font-size: 11px; color: var(--muted); }
  .summary .value {
    font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px;
  }

  .toolbar { display: flex; justify-content: flex-end; gap: 6px; margin: 2px 0 12px; }
  .toolbar button { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 12px; }

  ul.timeline { list-style: none; margin: 0; padding: 0; }
  li.task {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 9px;
    display: grid; grid-template-columns: 18px 1fr auto; gap: 0 10px; align-items: center;
    transition: border-color .15s, opacity .15s, box-shadow .15s;
  }
  li.task.running { border-color: var(--accent); background: var(--accent-soft); }
  li.task.done { opacity: .5; }
  li.task.dragging { opacity: .9; box-shadow: 0 6px 18px rgba(0,0,0,.45); }

  .handle {
    grid-column: 1; color: var(--muted); font-size: 15px; line-height: 1;
    cursor: grab; user-select: none; touch-action: none; text-align: center;
    align-self: center; height: 100%; display: flex; align-items: center; justify-content: center;
  }
  .handle:active { cursor: grabbing; }
  .handle:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
  .handle.empty { cursor: default; }

  .task-main { grid-column: 2; min-width: 0; }
  .task-name {
    font-size: 15px; font-weight: 500; word-break: break-word;
    cursor: text; border-bottom: 1px dashed transparent;
  }
  .task-name:hover { border-bottom-color: var(--line); }
  li.task.done .task-name { text-decoration: line-through; }
  .task-meta {
    margin-top: 2px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center;
  }
  .task-meta .dur { color: var(--text); cursor: text; border-bottom: 1px dashed transparent; }
  .task-meta .dur:hover { border-bottom-color: var(--line); }
  .task-meta .dur.unset { color: var(--accent); }
  .task-meta .sched .arr { opacity: .45; margin: 0 1px; }
  .countdown { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .countdown.over { color: var(--warn); }

  .task-actions { grid-column: 3; display: flex; gap: 4px; align-items: center; }

  .inline-edit {
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 6px;
    color: var(--text); font: inherit; padding: 2px 6px; max-width: 100%;
  }
  .inline-edit.num { width: 64px; text-align: center; -moz-appearance: textfield; }
  .inline-edit.num::-webkit-outer-spin-button,
  .inline-edit.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
    font-size: 14px; padding: 8px 12px; color: var(--text); background: var(--panel-2);
    transition: filter .12s, background .12s;
  }
  button:active { filter: brightness(1.25); }
  button.primary { background: var(--accent); color: #06101f; font-weight: 600; }
  button.done-btn { background: var(--done); color: #052016; font-weight: 600; }
  button.icon {
    background: transparent; color: var(--muted); padding: 5px 7px;
    font-size: 16px; line-height: 1;
  }
  button.icon:hover { color: var(--text); }
  button.icon.go { background: var(--accent); color: #06101f; }
  button.icon.ok { background: var(--done); color: #052016; }

  .empty { text-align: center; color: var(--muted); padding: 36px 12px; font-size: 14px; }

  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 72%, transparent);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .addbar-inner {
    max-width: 560px; margin: 0 auto; display: flex; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px;
  }
  .addbar input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; padding: 4px 8px;
  }
  .add-btn {
    width: 44px; padding: 0; font-size: 22px; font-weight: 400; line-height: 1;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>いまやることタイマー</h1>
    <span class="now-clock" id="nowClock">--:--</span>
  </header>

  <div class="summary">
    <div class="card">
      <div class="label">残り</div>
      <div class="value" id="sumRemaining">0分</div>
    </div>
    <div class="card">
      <div class="label">終了予定</div>
      <div class="value" id="sumFinish">--:--</div>
    </div>
  </div>

  <div class="toolbar">
    <button id="clearDone" title="完了したものを消す">完了を消す</button>
    <button id="resetAll" title="すべて消す">全消去</button>
  </div>

  <ul class="timeline" id="timeline"></ul>
  <div class="empty" id="empty">
    下の欄に「やること 時間」を入れて＋。<br>
    改行で複数行を貼り付ければまとめて取り込めます。<br>
    例: 買い物 30 / ゲーム 1h / 昼寝 20m / 歯みがき 5
  </div>
</div>

<div class="addbar">
  <form class="addbar-inner" id="addForm">
    <input type="text" id="nameInput" placeholder="やること 30  （改行で複数貼り付けOK）" autocomplete="off" />
    <button type="submit" class="primary add-btn" title="追加">＋</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "imayaru.tasks.v1";

  /** @type {Array<{id:string,name:string,dur:number|null,status:string,startAt:number|null,endAt:number|null}>} */
  var tasks = load();
  var dragEl = null;
  var focusHandleId = null;

  // ---- persistence ----
  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) { return tasks.find(function (t) { return t.id === id; }); }

  // ---- parsing (bulk / inline) ----
  // "1h30m", "1h", "90m", "30", "1.5h", "20分", "1時間30分" -> minutes (or null)
  function parseDuration(token) {
    if (!token) return null;
    var t = String(token).trim().toLowerCase().replace(/\s+/g, "");
    var m;
    m = t.match(/^(\d+(?:\.\d+)?)(?:h|時間)(?:(\d+)(?:m|分)?)?$/);
    if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0));
    m = t.match(/^(\d+)(?:m|分)$/);
    if (m) return parseInt(m[1], 10);
    m = t.match(/^(\d+(?:\.\d+)?)$/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  // One line -> {name, dur|null}. Trailing token is read as duration when possible.
  function parseLine(line) {
    var s = String(line).replace(/　/g, " ").trim();
    if (!s) return null;
    var parts = s.split(/\s+/);
    if (parts.length >= 2) {
      var dur = parseDuration(parts[parts.length - 1]);
      if (dur != null) return { name: parts.slice(0, -1).join(" "), dur: dur };
    }
    return { name: s, dur: null }; // 時間が読めない -> 名前だけ取り込み（分は後で手動）
  }
  function addFromText(text) {
    var added = 0;
    String(text).split(/\r?\n/).forEach(function (line) {
      var p = parseLine(line);
      if (!p) return;
      tasks.push({ id: uid(), name: p.name, dur: p.dur, status: "pending", startAt: null, endAt: null });
      added++;
    });
    if (added) { save(); render(); }
    return added;
  }

  // ---- time helpers ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtClock(ms) { var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtMin(min) {
    if (min == null) return "—";
    if (min < 60) return min + "分";
    var h = Math.floor(min / 60), m = min % 60;
    return m === 0 ? h + "時間" : h + "時間" + m + "分";
  }
  function fmtCountdown(ms) {
    var over = ms < 0, s = Math.round(Math.abs(ms) / 1000);
    return (over ? "+" : "") + Math.floor(s / 60) + ":" + pad(s % 60);
  }

  // ---- scheduling ----
  function durMs(t) { return (t.dur || 0) * 60000; }
  function computeSchedule() {
    var now = Date.now(), cursor = now, sched = {};
    tasks.forEach(function (t) {
      if (t.status === "done") { sched[t.id] = { start: t.startAt, end: t.endAt }; return; }
      if (t.status === "running") {
        var end = t.startAt + durMs(t);
        sched[t.id] = { start: t.startAt, end: end };
        cursor = Math.max(now, end);
        return;
      }
      sched[t.id] = { start: cursor, end: cursor + durMs(t) };
      cursor += durMs(t);
    });
    return { sched: sched, finish: cursor };
  }
  function remainingMinutes() {
    var total = 0, now = Date.now();
    tasks.forEach(function (t) {
      if (t.status === "done") return;
      if (t.status === "running") total += Math.max(0, (t.startAt + durMs(t)) - now) / 60000;
      else total += (t.dur || 0);
    });
    return Math.round(total);
  }

  // ---- actions ----
  function startTask(id) {
    tasks.forEach(function (t) {
      if (t.status === "running" && t.id !== id) { t.status = "done"; t.endAt = Date.now(); }
    });
    var t = find(id);
    if (t) { t.status = "running"; t.startAt = Date.now(); t.endAt = null; }
    save(); render();
  }
  function finishTask(id) {
    var t = find(id);
    if (t) { t.status = "done"; t.endAt = Date.now(); if (!t.startAt) t.startAt = Date.now(); }
    save(); render();
  }
  function reopenTask(id) {
    var t = find(id);
    if (t) { t.status = "pending"; t.startAt = null; t.endAt = null; }
    save(); render();
  }
  function deleteTask(id) { tasks = tasks.filter(function (t) { return t.id !== id; }); save(); render(); }
  function move(id, dir) {
    var i = tasks.findIndex(function (t) { return t.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= tasks.length) return;
    var tmp = tasks[i]; tasks[i] = tasks[j]; tasks[j] = tmp;
    save(); render();
  }
  function firstActionableId() {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].status !== "done") return tasks[i].id;
    return null;
  }
  function anyRunning() { return tasks.some(function (t) { return t.status === "running"; }); }

  // ---- inline editing ----
  function editInline(span, current, numeric, commit) {
    var input = document.createElement("input");
    input.type = numeric ? "number" : "text";
    input.className = "inline-edit" + (numeric ? " num" : "");
    if (numeric) { input.min = 0; input.inputMode = "numeric"; }
    input.value = current;
    span.parentNode.replaceChild(input, span);
    input.focus(); input.select();
    var done = false;
    function fin(cancel) {
      if (done) return; done = true;
      if (!cancel) commit(input.value);
      save(); render();
    }
    input.addEventListener("blur", function () { fin(false); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); fin(false); }
      else if (e.key === "Escape") { fin(true); }
    });
  }

  // ---- drag & drop (mouse + touch via pointer events) ----
  function startDrag(e, handleEl, li) {
    if (e.button != null && e.button > 0) return;
    e.preventDefault();
    dragEl = li;
    li.classList.add("dragging");
    try { handleEl.setPointerCapture(e.pointerId); } catch (_) {}

    function onMove(ev) {
      var y = ev.clientY, items = [].slice.call(timelineEl.querySelectorAll("li.task")), ref = null;
      for (var i = 0; i < items.length; i++) {
        if (items[i] === dragEl) continue;
        var r = items[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) { ref = items[i]; break; }
      }
      if (ref) timelineEl.insertBefore(dragEl, ref); else timelineEl.appendChild(dragEl);
    }
    function onUp() {
      handleEl.removeEventListener("pointermove", onMove);
      handleEl.removeEventListener("pointerup", onUp);
      handleEl.removeEventListener("pointercancel", onUp);
      li.classList.remove("dragging");
      var ids = [].slice.call(timelineEl.querySelectorAll("li.task"))
        .map(function (x) { return x.getAttribute("data-id"); });
      tasks.sort(function (a, b) { return ids.indexOf(a.id) - ids.indexOf(b.id); });
      dragEl = null; save(); render();
    }
    handleEl.addEventListener("pointermove", onMove);
    handleEl.addEventListener("pointerup", onUp);
    handleEl.addEventListener("pointercancel", onUp);
  }

  // ---- rendering ----
  var timelineEl = document.getElementById("timeline");
  var emptyEl = document.getElementById("empty");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function iconBtn(label, cls, title, fn) {
    var b = el("button", "icon " + (cls || ""), label);
    if (title) b.title = title;
    b.addEventListener("click", fn);
    return b;
  }

  function render() {
    var result = computeSchedule(), sched = result.sched;
    var nextId = firstActionableId(), running = anyRunning();

    emptyEl.style.display = tasks.length ? "none" : "block";
    timelineEl.innerHTML = "";

    tasks.forEach(function (t) {
      var s = sched[t.id];
      var li = el("li", "task" + (t.status === "running" ? " running" : "") + (t.status === "done" ? " done" : ""));
      li.setAttribute("data-id", t.id);

      // drag handle (pending only)
      var handle = el("div", "handle", t.status === "pending" ? "⋮⋮" : "");
      if (t.status === "pending") {
        handle.tabIndex = 0;
        handle.setAttribute("role", "button");
        handle.setAttribute("aria-label", "ドラッグ、または Ctrl+↑↓ で並び替え");
        handle.addEventListener("pointerdown", function (e) { startDrag(e, handle, li); });
        handle.addEventListener("keydown", function (e) {
          if (e.ctrlKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault(); focusHandleId = t.id; move(t.id, e.key === "ArrowUp" ? -1 : 1);
          }
        });
      } else { handle.classList.add("empty"); }
      li.appendChild(handle);

      // main
      var main = el("div", "task-main");
      var nm = el("div", "task-name", t.name);
      nm.title = "タップで名前を編集";
      nm.addEventListener("click", function () {
        editInline(nm, t.name, false, function (v) { v = v.trim(); if (v) t.name = v; });
      });
      main.appendChild(nm);

      var meta = el("div", "task-meta");
      var dur = el("span", "dur" + (t.dur == null ? " unset" : ""), t.dur == null ? "分を設定" : fmtMin(t.dur));
      dur.title = "タップで時間を編集";
      dur.addEventListener("click", function () {
        editInline(dur, t.dur == null ? "" : t.dur, true, function (v) {
          v = String(v).trim();
          if (v === "") { t.dur = null; }
          else { var n = parseInt(v, 10); t.dur = (isNaN(n) || n < 0) ? null : n; }
        });
      });
      meta.appendChild(dur);

      if (s && s.start != null && s.end != null && (t.status !== "pending" || t.dur != null)) {
        var sc = el("span", "sched");
        sc.innerHTML = fmtClock(s.start) + "<span class='arr'>→</span>" + fmtClock(s.end);
        meta.appendChild(sc);
      }
      if (t.status === "running") {
        var cd = el("span", "countdown");
        cd.setAttribute("data-cd", t.id);
        meta.appendChild(cd);
      }
      main.appendChild(meta);
      li.appendChild(main);

      // actions
      var act = el("div", "task-actions");
      if (t.status === "running") {
        act.appendChild(iconBtn("✓", "ok", "完了", function () { finishTask(t.id); }));
      } else if (t.status === "done") {
        act.appendChild(iconBtn("↺", "", "やり直す", function () { reopenTask(t.id); }));
        act.appendChild(iconBtn("✕", "", "削除", function () { deleteTask(t.id); }));
      } else {
        if (t.id === nextId && !running) {
          act.appendChild(iconBtn("▶", "go", "実行", function () { startTask(t.id); }));
        }
        act.appendChild(iconBtn("✕", "", "削除", function () { deleteTask(t.id); }));
      }
      li.appendChild(act);
      timelineEl.appendChild(li);
    });

    document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
    var active = tasks.some(function (t) { return t.status !== "done"; });
    document.getElementById("sumFinish").textContent = active ? fmtClock(result.finish) : "--:--";

    if (focusHandleId) {
      var h = timelineEl.querySelector('li[data-id="' + focusHandleId + '"] .handle');
      if (h) h.focus();
      focusHandleId = null;
    }
    tick();
  }

  // ---- live ticking ----
  function tick() {
    var now = Date.now();
    timelineEl.querySelectorAll("[data-cd]").forEach(function (node) {
      var t = find(node.getAttribute("data-cd"));
      if (!t || t.status !== "running") return;
      var remain = (t.startAt + durMs(t)) - now;
      node.textContent = fmtCountdown(remain);
      node.classList.toggle("over", remain < 0);
    });
    document.getElementById("nowClock").textContent = fmtClock(now);
  }
  setInterval(function () {
    tick();
    if (anyRunning()) {
      var r = computeSchedule();
      document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
      document.getElementById("sumFinish").textContent = fmtClock(r.finish);
    }
  }, 1000);

  // ---- input wiring ----
  var nameInput = document.getElementById("nameInput");

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (addFromText(nameInput.value) > 0) { nameInput.value = ""; nameInput.focus(); }
    else nameInput.focus();
  });
  nameInput.addEventListener("paste", function (e) {
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (text && /[\r\n]/.test(text)) { e.preventDefault(); addFromText(text); nameInput.value = ""; }
  });

  document.getElementById("clearDone").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return t.status !== "done"; }); save(); render();
  });
  document.getElementById("resetAll").addEventListener("click", function () {
    if (tasks.length && !confirm("すべて消します。よろしいですか？")) return;
    tasks = []; save(); render();
  });

  render();
})();
</script>
</body>
</html>
