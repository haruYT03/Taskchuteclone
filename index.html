<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e6e7ee" />
<title>いまやること</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e6e7ee;
    --text: #4a4f5c;
    --muted: #9aa0ad;
    --faded: rgba(74, 79, 92, 0.42);
    --accent: #5b8def;
    --done: #3fb27f;
    --warn: #e9606b;
    --radius: 16px;
    --sh-dark: rgba(163, 177, 198, 0.55);
    --sh-light: #ffffff;
    --raise: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
    --raise-sm: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
    --inset: inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);
    --inset-sm: inset 2px 2px 5px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont,
                 "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 96px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 16px; min-height: 26px;
  }
  .now-clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .corner { display: flex; gap: 4px; }
  .corner-btn {
    background: transparent; border: none; cursor: pointer; padding: 6px;
    color: var(--muted); opacity: .6; transition: opacity .15s, color .15s;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .corner-btn:hover { opacity: 1; color: var(--text); }
  .corner-btn svg { width: 17px; height: 17px; }

  .summary { display: flex; gap: 14px; margin-bottom: 18px; }
  .summary .card {
    flex: 1; border-radius: var(--radius); padding: 11px 15px; box-shadow: var(--raise);
  }
  .summary .label { font-size: 11px; color: var(--muted); }
  .summary .value {
    font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px;
  }

  ul.timeline { list-style: none; margin: 0; padding: 0; }
  li.task {
    border-radius: var(--radius); padding: 13px 14px; margin-bottom: 13px;
    box-shadow: var(--raise);
    display: grid; grid-template-columns: 44px 1fr auto; gap: 0 12px; align-items: center;
    transition: box-shadow .2s, opacity .25s;
  }
  li.task.running { box-shadow: var(--raise), inset 0 0 0 2px rgba(91, 141, 239, .55); }
  li.task.done { opacity: .5; }
  .timeline.focusing li.task:not(.running) { opacity: .36; }
  .timeline.focusing li.task.running { opacity: 1; }

  /* left timeline column: predicted clock time, vertically aligned */
  .task-time {
    grid-column: 1; font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums; letter-spacing: .02em; align-self: center;
  }
  li.task.running .task-time { color: var(--accent); font-weight: 700; }

  .task-main { grid-column: 2; min-width: 0; }
  .headline { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .task-name { font-size: 15px; font-weight: 500; word-break: break-word; cursor: text; }
  li.task.done .task-name { text-decoration: line-through; }
  .task-dur { font-size: 15px; color: var(--faded); white-space: nowrap; cursor: text; }
  .task-dur.unset { color: var(--accent); }
  .countdown {
    margin-top: 2px; font-size: 12px; color: var(--accent); font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .countdown.over { color: var(--warn); }

  .task-actions { grid-column: 3; display: flex; gap: 6px; align-items: center; }

  .inline-edit {
    background: var(--bg); border: none; box-shadow: var(--inset-sm); border-radius: 8px;
    color: var(--text); font: inherit; padding: 2px 8px; max-width: 100%; outline: none;
  }
  .inline-edit.num { width: 72px; text-align: center; -moz-appearance: textfield; }
  .inline-edit.num::-webkit-outer-spin-button,
  .inline-edit.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  button { font-family: inherit; cursor: pointer; border: none; color: var(--text); background: var(--bg); }
  button svg { display: block; }

  /* compact, flat reorder chevrons with a roomy hit area */
  .reorder { display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .mini {
    width: 30px; height: 21px; border-radius: 7px; padding: 0;
    background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center; transition: color .12s;
  }
  .mini svg { width: 13px; height: 13px; }
  .mini:hover { color: var(--text); }
  .mini:disabled { opacity: .26; cursor: default; }

  /* flat secondary icons (delete / reopen) */
  .icon-flat {
    width: 32px; height: 32px; border-radius: 9px;
    background: transparent; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; transition: color .12s;
  }
  .icon-flat svg { width: 16px; height: 16px; }
  .icon-flat:hover { color: var(--text); }

  /* strong primary icons (run / done) */
  .icon-strong {
    width: 40px; height: 40px; border-radius: 13px;
    box-shadow: var(--raise-sm); color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: box-shadow .14s, transform .05s, color .14s;
  }
  .icon-strong svg { width: 17px; height: 17px; }
  .icon-strong:active { box-shadow: var(--inset-sm); transform: translateY(1px); }
  .icon-strong.go { color: var(--accent); }
  .icon-strong.ok { color: var(--done); }

  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 74%, transparent);
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .addbar-inner {
    max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
    border-radius: var(--radius); padding: 7px 7px 7px 6px; box-shadow: var(--inset);
  }
  .addbar input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; font-family: inherit; padding: 6px 10px;
  }
  .add-btn {
    width: 46px; height: 42px; border-radius: 13px; flex: none; color: var(--accent);
    box-shadow: var(--raise-sm); display: flex; align-items: center; justify-content: center;
    transition: box-shadow .14s, transform .05s;
  }
  .add-btn svg { width: 22px; height: 22px; }
  .add-btn:active { box-shadow: var(--inset-sm); transform: translateY(1px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="now-clock" id="nowClock">--:--</span>
    <div class="corner">
      <button id="clearDone" class="corner-btn" title="完了したものを消す"></button>
      <button id="resetAll" class="corner-btn" title="すべて消す"></button>
    </div>
  </header>

  <div class="summary">
    <div class="card">
      <div class="label">残り</div>
      <div class="value" id="sumRemaining">0m</div>
    </div>
    <div class="card">
      <div class="label">終了予定</div>
      <div class="value" id="sumFinish">--:--</div>
    </div>
  </div>

  <ul class="timeline" id="timeline"></ul>
</div>

<div class="addbar">
  <form class="addbar-inner" id="addForm">
    <input type="text" id="nameInput" autocomplete="off" />
    <button type="submit" class="add-btn" title="追加" id="addBtn"></button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "imayaru.tasks.v1";

  // ---- monochrome inline SVG icons (no emoji) ----
  var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">';
  var ICON = {
    play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.3l11 6.7-11 6.7z"/></svg>',
    check: S + '<path d="M5 12.5l4.2 4.2L19 7"/></svg>',
    x:     S + '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
    undo:  S + '<path d="M9 5L4 9.5l5 4.5"/><path d="M4 9.5h9a6 6 0 0 1 0 12H8"/></svg>',
    up:    S + '<path d="M5 14l7-7 7 7"/></svg>',
    down:  S + '<path d="M5 10l7 7 7-7"/></svg>',
    plus:  S + '<path d="M12 5v14M5 12h14"/></svg>',
    trash: S + '<path d="M4 7h16"/><path d="M9.5 7V5h5v2"/><path d="M6.6 7l.9 12.1a1 1 0 0 0 1 .9h7a1 1 0 0 0 1-.9L17.4 7"/><path d="M10 10.5v6M14 10.5v6"/></svg>',
    sweep: S + '<path d="M3 13l3.6 3.6L13 9"/><path d="M11 15.5l1.3 1.3L21 8"/></svg>'
  };

  /** @type {Array<{id:string,name:string,dur:number|null,status:string,startAt:number|null,endAt:number|null}>} */
  var tasks = load();
  var undoStack = [], redoStack = [];

  // ---- persistence ----
  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) { return tasks.find(function (t) { return t.id === id; }); }

  // ---- undo / redo ----
  function pushHistory() {
    undoStack.push(JSON.stringify(tasks));
    if (undoStack.length > 200) undoStack.shift();
    redoStack.length = 0;
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(JSON.stringify(tasks));
    tasks = JSON.parse(undoStack.pop()); save(); render();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(JSON.stringify(tasks));
    tasks = JSON.parse(redoStack.pop()); save(); render();
  }

  // ---- parsing (bulk / inline) ----
  function parseDuration(token) {
    if (!token) return null;
    var t = String(token).trim().toLowerCase().replace(/\s+/g, ""), m;
    m = t.match(/^(\d+(?:\.\d+)?)(?:h|時間)(?:(\d+)(?:m|分)?)?$/);
    if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0));
    m = t.match(/^(\d+)(?:m|分)$/);
    if (m) return parseInt(m[1], 10);
    m = t.match(/^(\d+(?:\.\d+)?)$/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  function parseLine(line) {
    var s = String(line).replace(/　/g, " ").trim();
    if (!s) return null;
    var parts = s.split(/\s+/);
    if (parts.length >= 2) {
      var dur = parseDuration(parts[parts.length - 1]);
      if (dur != null) return { name: parts.slice(0, -1).join(" "), dur: dur };
    }
    return { name: s, dur: null };
  }
  function addFromText(text) {
    var items = [];
    String(text).split(/\r?\n/).forEach(function (line) { var p = parseLine(line); if (p) items.push(p); });
    if (!items.length) return 0;
    pushHistory();
    items.forEach(function (p) {
      tasks.push({ id: uid(), name: p.name, dur: p.dur, status: "pending", startAt: null, endAt: null });
    });
    save(); render();
    return items.length;
  }

  // ---- time helpers ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtClock(ms) { if (ms == null) return "--:--"; var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDur(min) {
    if (min == null) return "—";
    if (min < 60) return min + "m";
    var h = Math.floor(min / 60), m = min % 60;
    return m === 0 ? h + "h" : h + "h" + m + "m";
  }
  function fmtCountdown(ms) {
    var over = ms < 0, s = Math.round(Math.abs(ms) / 1000);
    return (over ? "+" : "") + Math.floor(s / 60) + ":" + pad(s % 60);
  }

  // ---- scheduling ----
  function durMs(t) { return (t.dur || 0) * 60000; }
  function computeSchedule() {
    var now = Date.now(), cursor = now, sched = {};
    tasks.forEach(function (t) {
      if (t.status === "done") { sched[t.id] = { start: t.startAt, end: t.endAt }; return; }
      if (t.status === "running") {
        var end = t.startAt + durMs(t);
        sched[t.id] = { start: t.startAt, end: end };
        cursor = Math.max(now, end);
        return;
      }
      sched[t.id] = { start: cursor, end: cursor + durMs(t) };
      cursor += durMs(t);
    });
    return { sched: sched, finish: cursor };
  }
  function remainingMinutes() {
    var total = 0, now = Date.now();
    tasks.forEach(function (t) {
      if (t.status === "done") return;
      if (t.status === "running") total += Math.max(0, (t.startAt + durMs(t)) - now) / 60000;
      else total += (t.dur || 0);
    });
    return Math.round(total);
  }

  // ---- actions ----
  function startTask(id) {
    pushHistory();
    tasks.forEach(function (t) { if (t.status === "running" && t.id !== id) { t.status = "done"; t.endAt = Date.now(); } });
    var t = find(id);
    if (t) { t.status = "running"; t.startAt = Date.now(); t.endAt = null; }
    save(); render();
  }
  function finishTask(id) {
    pushHistory();
    var t = find(id);
    if (t) { t.status = "done"; t.endAt = Date.now(); if (!t.startAt) t.startAt = Date.now(); }
    save(); render();
  }
  function reopenTask(id) {
    pushHistory();
    var t = find(id);
    if (t) { t.status = "pending"; t.startAt = null; t.endAt = null; }
    save(); render();
  }
  function deleteTask(id) {
    pushHistory();
    tasks = tasks.filter(function (t) { return t.id !== id; }); save(); render();
  }
  function move(id, dir) {
    var i = tasks.findIndex(function (t) { return t.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= tasks.length) return;
    pushHistory();
    var first = captureTops();
    var tmp = tasks[i]; tasks[i] = tasks[j]; tasks[j] = tmp;
    save(); render();
    flip(first);
  }
  function firstActionableId() {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].status !== "done") return tasks[i].id;
    return null;
  }
  function anyRunning() { return tasks.some(function (t) { return t.status === "running"; }); }

  // ---- FLIP reorder animation ----
  function captureTops() {
    var map = {};
    timelineEl.querySelectorAll("li.task").forEach(function (li) {
      map[li.getAttribute("data-id")] = li.getBoundingClientRect().top;
    });
    return map;
  }
  function flip(first) {
    timelineEl.querySelectorAll("li.task").forEach(function (li) {
      var prev = first[li.getAttribute("data-id")];
      if (prev == null) return;
      var dy = prev - li.getBoundingClientRect().top;
      if (!dy) return;
      li.style.transition = "none";
      li.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(function () {
        li.style.transition = "transform .17s cubic-bezier(.2,.8,.2,1)";
        li.style.transform = "";
      });
    });
  }

  // ---- inline editing ----
  function editInline(span, current, numeric, commit) {
    var input = document.createElement("input");
    input.type = numeric ? "number" : "text";
    input.className = "inline-edit" + (numeric ? " num" : "");
    if (numeric) { input.min = 0; input.inputMode = "numeric"; }
    input.value = current;
    span.parentNode.replaceChild(input, span);
    input.focus(); input.select();
    var done = false;
    function fin(cancel) {
      if (done) return; done = true;
      if (!cancel) { pushHistory(); commit(input.value); }
      save(); render();
    }
    input.addEventListener("blur", function () { fin(false); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); fin(false); }
      else if (e.key === "Escape") { fin(true); }
    });
  }

  // ---- rendering ----
  var timelineEl = document.getElementById("timeline");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(icon, cls, title, fn, disabled) {
    var b = el("button", cls);
    b.innerHTML = icon;
    if (title) b.title = title;
    if (disabled) b.disabled = true;
    else if (fn) b.addEventListener("click", fn);
    return b;
  }

  function render() {
    var result = computeSchedule(), sched = result.sched;
    var nextId = firstActionableId(), running = anyRunning();
    var pendingIds = tasks.filter(function (t) { return t.status === "pending"; }).map(function (t) { return t.id; });

    timelineEl.classList.toggle("focusing", running);
    timelineEl.innerHTML = "";

    tasks.forEach(function (t) {
      var s = sched[t.id];
      var li = el("li", "task" + (t.status === "running" ? " running" : "") + (t.status === "done" ? " done" : ""));
      li.setAttribute("data-id", t.id);

      // col 1: predicted start time (aligned timeline column)
      li.appendChild(el("div", "task-time", fmtClock(s ? s.start : null)));

      // col 2: name + duration (+ countdown when running)
      var main = el("div", "task-main");
      var head = el("div", "headline");
      var nm = el("span", "task-name", t.name);
      nm.title = "タップで名前を編集";
      nm.addEventListener("click", function () {
        editInline(nm, t.name, false, function (v) { v = v.trim(); if (v) t.name = v; });
      });
      var dur = el("span", "task-dur" + (t.dur == null ? " unset" : ""), fmtDur(t.dur));
      dur.title = "タップで時間を編集";
      dur.addEventListener("click", function () {
        editInline(dur, t.dur == null ? "" : t.dur, true, function (v) {
          v = String(v).trim();
          if (v === "") { t.dur = null; }
          else { var n = parseInt(v, 10); t.dur = (isNaN(n) || n < 0) ? null : n; }
        });
      });
      head.appendChild(nm); head.appendChild(dur);
      main.appendChild(head);
      if (t.status === "running") {
        var cd = el("div", "countdown");
        cd.setAttribute("data-cd", t.id);
        main.appendChild(cd);
      }
      li.appendChild(main);

      // col 3: actions
      var act = el("div", "task-actions");
      if (t.status === "running") {
        act.appendChild(btn(ICON.check, "icon-strong ok", "完了", function () { finishTask(t.id); }));
      } else if (t.status === "done") {
        act.appendChild(btn(ICON.undo, "icon-flat", "やり直す", function () { reopenTask(t.id); }));
        act.appendChild(btn(ICON.x, "icon-flat", "削除", function () { deleteTask(t.id); }));
      } else {
        if (t.id === nextId && !running) {
          act.appendChild(btn(ICON.play, "icon-strong go", "実行", function () { startTask(t.id); }));
        }
        var pi = pendingIds.indexOf(t.id);
        var reorder = el("div", "reorder");
        reorder.appendChild(btn(ICON.up, "mini", "上へ", function () { move(t.id, -1); }, pi <= 0));
        reorder.appendChild(btn(ICON.down, "mini", "下へ", function () { move(t.id, 1); }, pi === pendingIds.length - 1));
        act.appendChild(reorder);
        act.appendChild(btn(ICON.x, "icon-flat", "削除", function () { deleteTask(t.id); }));
      }
      li.appendChild(act);
      timelineEl.appendChild(li);
    });

    document.getElementById("sumRemaining").textContent = fmtDur(remainingMinutes());
    var active = tasks.some(function (t) { return t.status !== "done"; });
    document.getElementById("sumFinish").textContent = active ? fmtClock(result.finish) : "--:--";
    tick();
  }

  // ---- live ticking ----
  function tick() {
    var now = Date.now();
    timelineEl.querySelectorAll("[data-cd]").forEach(function (node) {
      var t = find(node.getAttribute("data-cd"));
      if (!t || t.status !== "running") return;
      var remain = (t.startAt + durMs(t)) - now;
      node.textContent = fmtCountdown(remain);
      node.classList.toggle("over", remain < 0);
    });
    document.getElementById("nowClock").textContent = fmtClock(now);
  }
  setInterval(function () {
    tick();
    if (anyRunning()) {
      var r = computeSchedule();
      document.getElementById("sumRemaining").textContent = fmtDur(remainingMinutes());
      document.getElementById("sumFinish").textContent = fmtClock(r.finish);
    }
  }, 1000);

  // ---- input wiring ----
  document.getElementById("addBtn").innerHTML = ICON.plus;
  document.getElementById("clearDone").innerHTML = ICON.sweep;
  document.getElementById("resetAll").innerHTML = ICON.trash;

  var nameInput = document.getElementById("nameInput");
  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (addFromText(nameInput.value) > 0) nameInput.value = "";
    nameInput.focus();
  });
  nameInput.addEventListener("paste", function (e) {
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (text && /[\r\n]/.test(text)) { e.preventDefault(); addFromText(text); nameInput.value = ""; }
  });
  document.getElementById("clearDone").addEventListener("click", function () {
    if (!tasks.some(function (t) { return t.status === "done"; })) return;
    pushHistory();
    tasks = tasks.filter(function (t) { return t.status !== "done"; }); save(); render();
  });
  document.getElementById("resetAll").addEventListener("click", function () {
    if (!tasks.length || !confirm("すべて消します。よろしいですか？")) return;
    pushHistory();
    tasks = []; save(); render();
  });

  // ---- undo/redo keyboard ----
  document.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    var ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
    var k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
  });

  render();
})();
</script>
</body>
</html>
