<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d2128" />
<title>いまやることタイマー</title>
<style>
  :root {
    --bg: #1d2128;
    --text: #e7eaf0;
    --muted: #8b93a3;
    --faded: rgba(231, 234, 240, 0.42);
    --accent: #4f9dff;
    --done: #54c08a;
    --warn: #ff6b6b;
    --radius: 16px;
    /* neumorphism shadows */
    --sh-dark: rgba(0, 0, 0, 0.55);
    --sh-light: rgba(255, 255, 255, 0.045);
    --raise: 5px 5px 12px var(--sh-dark), -5px -5px 12px var(--sh-light);
    --raise-sm: 3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light);
    --inset: inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);
    --inset-sm: inset 2px 2px 5px var(--sh-dark), inset -2px -2px 5px var(--sh-light);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 96px; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .now-clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

  .summary { display: flex; gap: 14px; margin-bottom: 16px; }
  .summary .card {
    flex: 1; border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--raise);
  }
  .summary .label { font-size: 11px; color: var(--muted); }
  .summary .value {
    font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px;
  }

  .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin: 2px 2px 14px; }
  .toolbar button {
    background: var(--bg); color: var(--muted); padding: 6px 12px; font-size: 12px;
    border-radius: 11px; box-shadow: var(--raise-sm);
  }
  .toolbar button:active { box-shadow: var(--inset-sm); }

  ul.timeline { list-style: none; margin: 0; padding: 0; }
  li.task {
    border-radius: var(--radius); padding: 13px 15px; margin-bottom: 13px;
    box-shadow: var(--raise);
    display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: center;
    transition: box-shadow .2s, opacity .2s;
    will-change: transform;
  }
  li.task.running { box-shadow: var(--raise), inset 0 0 0 1.5px rgba(79,157,255,.5); }
  li.task.done { opacity: .5; }

  .task-main { min-width: 0; }
  .headline { display: flex; align-items: baseline; gap: 10px; }
  .task-name {
    font-size: 15px; font-weight: 500; word-break: break-word; min-width: 0;
    cursor: text;
  }
  li.task.done .task-name { text-decoration: line-through; }
  .task-dur {
    font-size: 15px; color: var(--faded); margin-left: auto; white-space: nowrap;
    cursor: text;
  }
  .task-dur.unset { color: var(--accent); }

  .task-meta {
    margin-top: 3px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center;
  }
  .task-meta .sched .arr { opacity: .45; margin: 0 1px; }
  .countdown { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .countdown.over { color: var(--warn); }

  .task-actions { display: flex; gap: 7px; align-items: center; }

  .inline-edit {
    background: var(--bg); border: none; box-shadow: var(--inset-sm); border-radius: 8px;
    color: var(--text); font: inherit; padding: 2px 8px; max-width: 100%; outline: none;
  }
  .inline-edit.num { width: 70px; text-align: center; -moz-appearance: textfield; }
  .inline-edit.num::-webkit-outer-spin-button,
  .inline-edit.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  button {
    font-family: inherit; cursor: pointer; border: none; color: var(--text);
    background: var(--bg); transition: box-shadow .14s, color .14s, transform .05s;
  }
  button.icon {
    width: 38px; height: 38px; border-radius: 12px; font-size: 15px; line-height: 1;
    color: var(--muted); box-shadow: var(--raise-sm);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  button.icon:hover { color: var(--text); }
  button.icon:active { box-shadow: var(--inset-sm); transform: translateY(1px); }
  button.icon.go { color: var(--accent); }
  button.icon.ok { color: var(--done); }
  button.icon:disabled { opacity: .35; box-shadow: var(--raise-sm); cursor: default; }

  .empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }

  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 74%, transparent);
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .addbar-inner {
    max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center;
    border-radius: var(--radius); padding: 8px 8px 8px 6px; box-shadow: var(--inset);
  }
  .addbar input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; padding: 6px 10px;
  }
  .add-btn {
    width: 46px; height: 42px; border-radius: 13px; flex: none;
    font-size: 24px; font-weight: 300; line-height: 1; color: var(--accent);
    box-shadow: var(--raise-sm); display: flex; align-items: center; justify-content: center;
  }
  .add-btn:active { box-shadow: var(--inset-sm); transform: translateY(1px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>いまやることタイマー</h1>
    <span class="now-clock" id="nowClock">--:--</span>
  </header>

  <div class="summary">
    <div class="card">
      <div class="label">残り</div>
      <div class="value" id="sumRemaining">0分</div>
    </div>
    <div class="card">
      <div class="label">終了予定</div>
      <div class="value" id="sumFinish">--:--</div>
    </div>
  </div>

  <div class="toolbar">
    <button id="clearDone" title="完了したものを消す">完了を消す</button>
    <button id="resetAll" title="すべて消す">全消去</button>
  </div>

  <ul class="timeline" id="timeline"></ul>
  <div class="empty" id="empty">下の欄から「やること」を追加しましょう。</div>
</div>

<div class="addbar">
  <form class="addbar-inner" id="addForm">
    <input type="text" id="nameInput" placeholder="やること（改行で複数貼り付けOK）" autocomplete="off" />
    <button type="submit" class="add-btn" title="追加">＋</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "imayaru.tasks.v1";

  /** @type {Array<{id:string,name:string,dur:number|null,status:string,startAt:number|null,endAt:number|null}>} */
  var tasks = load();

  // ---- persistence ----
  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) { return tasks.find(function (t) { return t.id === id; }); }

  // ---- parsing (bulk / inline) ----
  function parseDuration(token) {
    if (!token) return null;
    var t = String(token).trim().toLowerCase().replace(/\s+/g, ""), m;
    m = t.match(/^(\d+(?:\.\d+)?)(?:h|時間)(?:(\d+)(?:m|分)?)?$/);
    if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0));
    m = t.match(/^(\d+)(?:m|分)$/);
    if (m) return parseInt(m[1], 10);
    m = t.match(/^(\d+(?:\.\d+)?)$/);
    if (m) return Math.round(parseFloat(m[1]));
    return null;
  }
  function parseLine(line) {
    var s = String(line).replace(/　/g, " ").trim();
    if (!s) return null;
    var parts = s.split(/\s+/);
    if (parts.length >= 2) {
      var dur = parseDuration(parts[parts.length - 1]);
      if (dur != null) return { name: parts.slice(0, -1).join(" "), dur: dur };
    }
    return { name: s, dur: null };
  }
  function addFromText(text) {
    var added = 0;
    String(text).split(/\r?\n/).forEach(function (line) {
      var p = parseLine(line);
      if (!p) return;
      tasks.push({ id: uid(), name: p.name, dur: p.dur, status: "pending", startAt: null, endAt: null });
      added++;
    });
    if (added) { save(); render(); }
    return added;
  }

  // ---- time helpers ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtClock(ms) { var d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtMin(min) {
    if (min == null) return "—";
    if (min < 60) return min + "分";
    var h = Math.floor(min / 60), m = min % 60;
    return m === 0 ? h + "時間" : h + "時間" + m + "分";
  }
  function fmtCountdown(ms) {
    var over = ms < 0, s = Math.round(Math.abs(ms) / 1000);
    return (over ? "+" : "") + Math.floor(s / 60) + ":" + pad(s % 60);
  }

  // ---- scheduling ----
  function durMs(t) { return (t.dur || 0) * 60000; }
  function computeSchedule() {
    var now = Date.now(), cursor = now, sched = {};
    tasks.forEach(function (t) {
      if (t.status === "done") { sched[t.id] = { start: t.startAt, end: t.endAt }; return; }
      if (t.status === "running") {
        var end = t.startAt + durMs(t);
        sched[t.id] = { start: t.startAt, end: end };
        cursor = Math.max(now, end);
        return;
      }
      sched[t.id] = { start: cursor, end: cursor + durMs(t) };
      cursor += durMs(t);
    });
    return { sched: sched, finish: cursor };
  }
  function remainingMinutes() {
    var total = 0, now = Date.now();
    tasks.forEach(function (t) {
      if (t.status === "done") return;
      if (t.status === "running") total += Math.max(0, (t.startAt + durMs(t)) - now) / 60000;
      else total += (t.dur || 0);
    });
    return Math.round(total);
  }

  // ---- actions ----
  function startTask(id) {
    tasks.forEach(function (t) {
      if (t.status === "running" && t.id !== id) { t.status = "done"; t.endAt = Date.now(); }
    });
    var t = find(id);
    if (t) { t.status = "running"; t.startAt = Date.now(); t.endAt = null; }
    save(); render();
  }
  function finishTask(id) {
    var t = find(id);
    if (t) { t.status = "done"; t.endAt = Date.now(); if (!t.startAt) t.startAt = Date.now(); }
    save(); render();
  }
  function reopenTask(id) {
    var t = find(id);
    if (t) { t.status = "pending"; t.startAt = null; t.endAt = null; }
    save(); render();
  }
  function deleteTask(id) { tasks = tasks.filter(function (t) { return t.id !== id; }); save(); render(); }
  function move(id, dir) {
    var i = tasks.findIndex(function (t) { return t.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= tasks.length) return;
    var first = captureTops();
    var tmp = tasks[i]; tasks[i] = tasks[j]; tasks[j] = tmp;
    save(); render();
    flip(first);
  }
  function firstActionableId() {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].status !== "done") return tasks[i].id;
    return null;
  }
  function anyRunning() { return tasks.some(function (t) { return t.status === "running"; }); }

  // ---- FLIP reorder animation ----
  function captureTops() {
    var map = {};
    timelineEl.querySelectorAll("li.task").forEach(function (li) {
      map[li.getAttribute("data-id")] = li.getBoundingClientRect().top;
    });
    return map;
  }
  function flip(first) {
    timelineEl.querySelectorAll("li.task").forEach(function (li) {
      var prev = first[li.getAttribute("data-id")];
      if (prev == null) return;
      var dy = prev - li.getBoundingClientRect().top;
      if (!dy) return;
      li.style.transition = "none";
      li.style.transform = "translateY(" + dy + "px)";
      requestAnimationFrame(function () {
        li.style.transition = "transform .17s cubic-bezier(.2,.8,.2,1)";
        li.style.transform = "";
      });
    });
  }

  // ---- inline editing ----
  function editInline(span, current, numeric, commit) {
    var input = document.createElement("input");
    input.type = numeric ? "number" : "text";
    input.className = "inline-edit" + (numeric ? " num" : "");
    if (numeric) { input.min = 0; input.inputMode = "numeric"; }
    input.value = current;
    span.parentNode.replaceChild(input, span);
    input.focus(); input.select();
    var done = false;
    function fin(cancel) {
      if (done) return; done = true;
      if (!cancel) commit(input.value);
      save(); render();
    }
    input.addEventListener("blur", function () { fin(false); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); fin(false); }
      else if (e.key === "Escape") { fin(true); }
    });
  }

  // ---- rendering ----
  var timelineEl = document.getElementById("timeline");
  var emptyEl = document.getElementById("empty");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function iconBtn(label, cls, title, fn, disabled) {
    var b = el("button", "icon " + (cls || ""), label);
    if (title) b.title = title;
    if (disabled) b.disabled = true;
    else b.addEventListener("click", fn);
    return b;
  }

  function render() {
    var result = computeSchedule(), sched = result.sched;
    var nextId = firstActionableId(), running = anyRunning();
    var pendingIds = tasks.filter(function (t) { return t.status === "pending"; }).map(function (t) { return t.id; });

    emptyEl.style.display = tasks.length ? "none" : "block";
    timelineEl.innerHTML = "";

    tasks.forEach(function (t) {
      var s = sched[t.id];
      var li = el("li", "task" + (t.status === "running" ? " running" : "") + (t.status === "done" ? " done" : ""));
      li.setAttribute("data-id", t.id);

      // main: headline (name + duration) then meta (times)
      var main = el("div", "task-main");
      var head = el("div", "headline");
      var nm = el("span", "task-name", t.name);
      nm.title = "タップで名前を編集";
      nm.addEventListener("click", function () {
        editInline(nm, t.name, false, function (v) { v = v.trim(); if (v) t.name = v; });
      });
      var dur = el("span", "task-dur" + (t.dur == null ? " unset" : ""), t.dur == null ? "分を設定" : fmtMin(t.dur));
      dur.title = "タップで時間を編集";
      dur.addEventListener("click", function () {
        editInline(dur, t.dur == null ? "" : t.dur, true, function (v) {
          v = String(v).trim();
          if (v === "") { t.dur = null; }
          else { var n = parseInt(v, 10); t.dur = (isNaN(n) || n < 0) ? null : n; }
        });
      });
      head.appendChild(nm); head.appendChild(dur);
      main.appendChild(head);

      var meta = el("div", "task-meta");
      if (s && s.start != null && s.end != null && (t.status !== "pending" || t.dur != null)) {
        var sc = el("span", "sched");
        sc.innerHTML = fmtClock(s.start) + "<span class='arr'>→</span>" + fmtClock(s.end);
        meta.appendChild(sc);
      }
      if (t.status === "running") {
        var cd = el("span", "countdown");
        cd.setAttribute("data-cd", t.id);
        meta.appendChild(cd);
      }
      if (meta.childNodes.length) main.appendChild(meta);
      li.appendChild(main);

      // actions
      var act = el("div", "task-actions");
      if (t.status === "running") {
        act.appendChild(iconBtn("✓", "ok", "完了", function () { finishTask(t.id); }));
      } else if (t.status === "done") {
        act.appendChild(iconBtn("↺", "", "やり直す", function () { reopenTask(t.id); }));
        act.appendChild(iconBtn("✕", "", "削除", function () { deleteTask(t.id); }));
      } else {
        if (t.id === nextId && !running) {
          act.appendChild(iconBtn("▶", "go", "実行", function () { startTask(t.id); }));
        }
        var pi = pendingIds.indexOf(t.id);
        act.appendChild(iconBtn("▲", "", "上へ", function () { move(t.id, -1); }, pi <= 0));
        act.appendChild(iconBtn("▼", "", "下へ", function () { move(t.id, 1); }, pi === pendingIds.length - 1));
        act.appendChild(iconBtn("✕", "", "削除", function () { deleteTask(t.id); }));
      }
      li.appendChild(act);
      timelineEl.appendChild(li);
    });

    document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
    var active = tasks.some(function (t) { return t.status !== "done"; });
    document.getElementById("sumFinish").textContent = active ? fmtClock(result.finish) : "--:--";
    tick();
  }

  // ---- live ticking ----
  function tick() {
    var now = Date.now();
    timelineEl.querySelectorAll("[data-cd]").forEach(function (node) {
      var t = find(node.getAttribute("data-cd"));
      if (!t || t.status !== "running") return;
      var remain = (t.startAt + durMs(t)) - now;
      node.textContent = fmtCountdown(remain);
      node.classList.toggle("over", remain < 0);
    });
    document.getElementById("nowClock").textContent = fmtClock(now);
  }
  setInterval(function () {
    tick();
    if (anyRunning()) {
      var r = computeSchedule();
      document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
      document.getElementById("sumFinish").textContent = fmtClock(r.finish);
    }
  }, 1000);

  // ---- input wiring ----
  var nameInput = document.getElementById("nameInput");
  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (addFromText(nameInput.value) > 0) nameInput.value = "";
    nameInput.focus();
  });
  nameInput.addEventListener("paste", function (e) {
    var text = (e.clipboardData || window.clipboardData).getData("text");
    if (text && /[\r\n]/.test(text)) { e.preventDefault(); addFromText(text); nameInput.value = ""; }
  });
  document.getElementById("clearDone").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return t.status !== "done"; }); save(); render();
  });
  document.getElementById("resetAll").addEventListener("click", function () {
    if (tasks.length && !confirm("すべて消します。よろしいですか？")) return;
    tasks = []; save(); render();
  });

  render();
})();
</script>
</body>
</html>
