<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>いまやることタイマー</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f242e;
    --line: #2a303c;
    --text: #e7eaf0;
    --muted: #8b93a3;
    --accent: #4f9dff;
    --accent-soft: rgba(79, 157, 255, 0.15);
    --done: #4caf7d;
    --warn: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 96px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .now-clock {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 13px;
  }

  .summary {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .summary .card {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .summary .label { font-size: 11px; color: var(--muted); }
  .summary .value {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  ul.timeline { list-style: none; margin: 0; padding: 0; }
  li.task {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    align-items: center;
    transition: border-color .15s, opacity .15s;
  }
  li.task.running { border-color: var(--accent); background: var(--accent-soft); }
  li.task.done { opacity: .55; }

  .task-main { min-width: 0; }
  .task-name {
    font-size: 15px;
    font-weight: 500;
    word-break: break-word;
  }
  li.task.done .task-name { text-decoration: line-through; }
  .task-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: center;
  }
  .task-meta .dur { color: var(--text); }
  .task-meta .sched .arr { opacity: .5; margin: 0 2px; }
  .countdown {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .countdown.over { color: var(--warn); }

  .task-actions { display: flex; gap: 6px; align-items: center; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    padding: 8px 14px;
    color: var(--text);
    background: var(--panel-2);
    transition: filter .12s, background .12s;
  }
  button:active { filter: brightness(1.25); }
  button.primary { background: var(--accent); color: #06101f; font-weight: 600; }
  button.done-btn { background: var(--done); color: #052016; font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 8px; }
  button.icon { background: transparent; color: var(--muted); padding: 4px 6px; font-size: 16px; line-height: 1; }
  button.icon:hover { color: var(--text); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 12px;
    font-size: 14px;
  }

  /* Add bar */
  .addbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .addbar-inner {
    max-width: 560px; margin: 0 auto;
    display: flex; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }
  .addbar input[type="text"] {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px; padding: 4px 6px;
  }
  .addbar input[type="number"] {
    width: 56px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text);
    font-size: 15px; text-align: center; padding: 6px 4px;
    -moz-appearance: textfield;
  }
  .addbar input[type="number"]::-webkit-outer-spin-button,
  .addbar input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .addbar .unit { color: var(--muted); font-size: 12px; align-self: center; }

  .quick {
    display: flex; gap: 6px; flex-wrap: wrap;
    max-width: 560px; margin: 0 auto 8px; justify-content: flex-end;
  }
  .quick button { padding: 5px 10px; font-size: 12px; background: var(--panel-2); color: var(--muted); }

  .toolbar {
    display: flex; justify-content: flex-end; gap: 8px;
    margin: 4px 0 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>いまやることタイマー</h1>
    <span class="now-clock" id="nowClock">--:--</span>
  </header>

  <div class="summary">
    <div class="card">
      <div class="label">残り合計</div>
      <div class="value" id="sumRemaining">0分</div>
    </div>
    <div class="card">
      <div class="label">この調子だと終了</div>
      <div class="value" id="sumFinish">--:--</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="ghost" id="clearDone">完了を消す</button>
    <button class="ghost" id="resetAll">全部リセット</button>
  </div>

  <ul class="timeline" id="timeline"></ul>
  <div class="empty" id="empty">下の入力欄から「やること」と所要時間を足してください。<br>上から実行ボタンで順番に進みます。</div>
</div>

<div class="addbar">
  <div class="quick" id="quick">
    <button data-min="5">5分</button>
    <button data-min="10">10分</button>
    <button data-min="20">20分</button>
    <button data-min="40">40分</button>
  </div>
  <form class="addbar-inner" id="addForm">
    <input type="text" id="nameInput" placeholder="やること" autocomplete="off" />
    <input type="number" id="minInput" placeholder="分" min="1" max="600" inputmode="numeric" />
    <span class="unit">分</span>
    <button type="submit" class="primary">追加</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "imayaru.tasks.v1";

  /** @type {Array<{id:string,name:string,dur:number,status:string,startAt:number|null,endAt:number|null}>} */
  var tasks = load();
  var lastQuickMin = 10;

  // ---- persistence ----
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  // ---- time helpers ----
  function fmtClock(ms) {
    var d = new Date(ms);
    var h = d.getHours();
    var m = d.getMinutes();
    return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
  }
  function fmtMin(min) {
    if (min < 60) return min + "分";
    var h = Math.floor(min / 60), m = min % 60;
    return m === 0 ? h + "時間" : h + "時間" + m + "分";
  }
  function fmtCountdown(ms) {
    var over = ms < 0;
    var s = Math.round(Math.abs(ms) / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    var str = m + ":" + (sec < 10 ? "0" + sec : sec);
    return (over ? "+" : "") + str;
  }

  // ---- scheduling ----
  // Returns map id -> {start, end, projected} using a forward cursor from now.
  function computeSchedule() {
    var now = Date.now();
    var cursor = now;
    var sched = {};
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      var durMs = t.dur * 60000;
      if (t.status === "done") {
        sched[t.id] = { start: t.startAt, end: t.endAt, projected: false };
        continue;
      }
      if (t.status === "running") {
        var end = t.startAt + durMs;
        sched[t.id] = { start: t.startAt, end: end, projected: true };
        cursor = Math.max(now, end);
        continue;
      }
      // pending
      var s = cursor;
      var e = cursor + durMs;
      sched[t.id] = { start: s, end: e, projected: true };
      cursor = e;
    }
    return { sched: sched, finish: cursor };
  }

  function remainingMinutes() {
    var total = 0, now = Date.now();
    for (var i = 0; i < tasks.length; i++) {
      var t = tasks[i];
      if (t.status === "done") continue;
      if (t.status === "running") {
        var left = (t.startAt + t.dur * 60000) - now;
        total += Math.max(0, left) / 60000;
      } else {
        total += t.dur;
      }
    }
    return Math.round(total);
  }

  // ---- actions ----
  function addTask(name, dur) {
    tasks.push({ id: uid(), name: name, dur: dur, status: "pending", startAt: null, endAt: null });
    save(); render();
  }
  function startTask(id) {
    // only one running at a time; if another runs, finish it first
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].status === "running" && tasks[i].id !== id) {
        tasks[i].status = "done";
        tasks[i].endAt = Date.now();
      }
    }
    var t = find(id);
    if (t) { t.status = "running"; t.startAt = Date.now(); t.endAt = null; }
    save(); render();
  }
  function finishTask(id) {
    var t = find(id);
    if (t) { t.status = "done"; t.endAt = Date.now(); if (!t.startAt) t.startAt = Date.now(); }
    save(); render();
  }
  function reopenTask(id) {
    var t = find(id);
    if (t) { t.status = "pending"; t.startAt = null; t.endAt = null; }
    save(); render();
  }
  function deleteTask(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save(); render();
  }
  function move(id, dir) {
    var i = tasks.findIndex(function (t) { return t.id === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= tasks.length) return;
    var tmp = tasks[i]; tasks[i] = tasks[j]; tasks[j] = tmp;
    save(); render();
  }
  function find(id) { return tasks.find(function (t) { return t.id === id; }); }

  function firstActionableId() {
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].status !== "done") return tasks[i].id;
    }
    return null;
  }
  function anyRunning() {
    return tasks.some(function (t) { return t.status === "running"; });
  }

  // ---- rendering ----
  var timelineEl = document.getElementById("timeline");
  var emptyEl = document.getElementById("empty");

  function render() {
    var result = computeSchedule();
    var sched = result.sched;

    emptyEl.style.display = tasks.length ? "none" : "block";
    timelineEl.innerHTML = "";

    var nextId = firstActionableId();
    var running = anyRunning();

    tasks.forEach(function (t) {
      var s = sched[t.id];
      var li = document.createElement("li");
      li.className = "task" + (t.status === "running" ? " running" : "") +
                     (t.status === "done" ? " done" : "");

      // main
      var main = document.createElement("div");
      main.className = "task-main";
      var nm = document.createElement("div");
      nm.className = "task-name";
      nm.textContent = t.name;
      main.appendChild(nm);

      var meta = document.createElement("div");
      meta.className = "task-meta";

      var dur = document.createElement("span");
      dur.className = "dur";
      dur.textContent = fmtMin(t.dur);
      meta.appendChild(dur);

      if (s && s.start != null && s.end != null) {
        var sc = document.createElement("span");
        sc.className = "sched";
        var tilde = "<span class='arr'>→</span>";
        sc.innerHTML = fmtClock(s.start) + tilde + fmtClock(s.end) +
                       (s.projected && t.status !== "running" ? " 予定" : "");
        meta.appendChild(sc);
      }

      if (t.status === "running") {
        var cd = document.createElement("span");
        cd.className = "countdown";
        cd.setAttribute("data-cd", t.id);
        meta.appendChild(cd);
      }
      main.appendChild(meta);
      li.appendChild(main);

      // actions
      var act = document.createElement("div");
      act.className = "task-actions";

      if (t.status === "running") {
        act.appendChild(btn("完了", "done-btn", function () { finishTask(t.id); }));
      } else if (t.status === "done") {
        act.appendChild(iconBtn("↺", function () { reopenTask(t.id); }, "やり直す"));
        act.appendChild(iconBtn("✕", function () { deleteTask(t.id); }, "削除"));
      } else {
        // pending
        if (t.id === nextId && !running) {
          act.appendChild(btn("実行", "primary", function () { startTask(t.id); }));
        } else {
          act.appendChild(iconBtn("▲", function () { move(t.id, -1); }, "上へ"));
          act.appendChild(iconBtn("▼", function () { move(t.id, 1); }, "下へ"));
          act.appendChild(iconBtn("✕", function () { deleteTask(t.id); }, "削除"));
        }
      }
      li.appendChild(act);
      timelineEl.appendChild(li);
    });

    document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
    var hasPendingOrRunning = tasks.some(function (t) { return t.status !== "done"; });
    document.getElementById("sumFinish").textContent =
      hasPendingOrRunning ? fmtClock(result.finish) : "--:--";

    tickCountdowns();
  }

  function btn(label, cls, fn) {
    var b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }
  function iconBtn(label, fn, title) {
    var b = document.createElement("button");
    b.className = "icon";
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener("click", fn);
    return b;
  }

  // ---- live ticking ----
  function tickCountdowns() {
    var now = Date.now();
    var nodes = document.querySelectorAll("[data-cd]");
    nodes.forEach(function (node) {
      var id = node.getAttribute("data-cd");
      var t = find(id);
      if (!t || t.status !== "running") return;
      var remain = (t.startAt + t.dur * 60000) - now;
      node.textContent = fmtCountdown(remain);
      node.classList.toggle("over", remain < 0);
    });
    document.getElementById("nowClock").textContent = fmtClock(now);
  }

  setInterval(function () {
    tickCountdowns();
    // keep projected finish/remaining fresh while a task runs
    if (anyRunning()) {
      var result = computeSchedule();
      document.getElementById("sumRemaining").textContent = fmtMin(remainingMinutes());
      document.getElementById("sumFinish").textContent = fmtClock(result.finish);
    }
  }, 1000);

  // ---- input wiring ----
  var nameInput = document.getElementById("nameInput");
  var minInput = document.getElementById("minInput");

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameInput.value.trim();
    var min = parseInt(minInput.value, 10);
    if (!name) { nameInput.focus(); return; }
    if (!min || min < 1) min = lastQuickMin;
    addTask(name, min);
    nameInput.value = "";
    minInput.value = "";
    nameInput.focus();
  });

  document.getElementById("quick").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-min]");
    if (!b) return;
    lastQuickMin = parseInt(b.getAttribute("data-min"), 10);
    minInput.value = lastQuickMin;
    nameInput.focus();
  });

  document.getElementById("clearDone").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return t.status !== "done"; });
    save(); render();
  });
  document.getElementById("resetAll").addEventListener("click", function () {
    if (tasks.length && !confirm("全部消します。よろしいですか？")) return;
    tasks = []; save(); render();
  });

  render();
})();
</script>
</body>
</html>
